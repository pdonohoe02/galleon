name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galleon
          POSTGRES_PASSWORD: galleon
          POSTGRES_USER: galleon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galleon -d galleon"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://galleon:galleon@127.0.0.1:5432/galleon
      GALLEON_ISSUER: http://galleon.localhost:3200
      GALLEON_INTEGRATION_TESTS: "true"
      GALLEON_PAIRWISE_SECRET: ci-pairwise-secret
      GALLEON_SIGNING_KEY_PATH: /tmp/galleon-ci-signing-key.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
