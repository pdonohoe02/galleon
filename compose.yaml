services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: galleon
      POSTGRES_PASSWORD: galleon
      POSTGRES_USER: galleon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galleon -d galleon"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - galleon-postgres:/var/lib/postgresql/data

volumes:
  galleon-postgres:
