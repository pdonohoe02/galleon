# Galleon — agent-native payment rail between AI agents and publishers.
#
# Several services share one image (see Dockerfile); each runs a different start
# command. publisher-demo is a SEPARATE origin on purpose: the product claim is
# that paid source content stays on the publisher's own infrastructure.
#
# Secrets are never in this file. Set them with:
#   floo env set NAME --stdin --secret --app galleon --service <service>

[app]
name = "galleon"
# Migrations run DDL, which floo only permits in autonomous mode. The CLI
# describes autonomous as the default when this is omitted, but `floo db
# migrate` was refused with it omitted, so it is set explicitly.
agent_mode = "autonomous"

[managed.default]
type = "postgres"

# Galleon platform: one Next app (platform-web) serving three surfaces.
#
# src/lib/surface.ts picks the surface from the incoming Host header alone:
# a host equal to GALLEON_CONSUMER_HOST renders the wallet, one equal to
# GALLEON_PUBLISHER_HOST renders the publisher console, and anything else
# falls through to the marketing landing page.
#
# Locally that is one process on three *.galleon.localhost hosts. floo gives
# one hostname per service, so the same app is deployed three times below —
# identical image and command, distinguished only by the hostname each one
# receives. GALLEON_CONSUMER_HOST/GALLEON_PUBLISHER_HOST are set app-wide and
# still resolve correctly, because each instance only ever sees its own host.

# Marketing landing. Matches neither host var, so it falls through to marketing.
[services.web]
type = "web"
path = "."
port = 8080
ingress = "public"
command = "exec pnpm --filter @galleon/platform-web exec next start -H 0.0.0.0 -p ${PORT:-8080}"
migrate_command = "pnpm --filter @galleon/database db:migrate"
dev_command = "pnpm --filter @galleon/platform-web dev"

# Consumer wallet — the app consumers log in to. Its hostname is set as
# GALLEON_CONSUMER_HOST. Named `app` so the URL reads galleon-…-app rather than
# galleon-…-wallet.
[services.app]
type = "web"
path = "."
port = 8080
ingress = "public"
command = "exec pnpm --filter @galleon/platform-web exec next start -H 0.0.0.0 -p ${PORT:-8080}"

# Publisher console. Its hostname is set as GALLEON_PUBLISHER_HOST.
[services.console]
type = "web"
path = "."
port = 8080
ingress = "public"
command = "exec pnpm --filter @galleon/platform-web exec next start -H 0.0.0.0 -p ${PORT:-8080}"

# Northline Review — the publisher demo. Registers the WebMCP tools.
[services.publisher]
type = "web"
path = "."
port = 8080
ingress = "public"
command = "exec pnpm --filter @galleon/publisher-demo exec next start -H 0.0.0.0 -p ${PORT:-8080}"
dev_command = "pnpm --filter @galleon/publisher-demo dev"

# Drift Signal — the unpaid publication, for contrast.
[services.blog]
type = "web"
path = "."
port = 8080
ingress = "public"
command = "exec pnpm --filter @galleon/mock-blog exec next start -H 0.0.0.0 -p ${PORT:-8080}"
dev_command = "pnpm --filter @galleon/mock-blog dev"

# The wallet MCP is no longer its own service. platform-web serves it in-process
# at the app host's /mcp (apps/platform-web/src/app/mcp), so an agent points at
# app.<host>/mcp — one URL under the dashboard's domain, purchase authority still
# server-side in Galleon.

[resources]
cpu = "1"
memory = "1Gi"
# Pinned to one instance: the ES256 signing key is still generated to a file
# at GALLEON_SIGNING_KEY_PATH, so a second instance would mint a different key
# and offers signed by one would fail verification on the other.
max_instances = 1
